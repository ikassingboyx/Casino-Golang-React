# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
#
# casino-api  Go backend (backend/Dockerfile); runs migrations on start
# casino-web  the built React app (static site); talks to casino-api directly
# casino-db   Postgres
#
# The app and the API are on different origins, so the URLs below must match
# what Render assigns (shown on each service's page). VITE_* are baked in at
# build time: after changing them, redeploy casino-web.

databases:
  - name: casino-db
    plan: free
    region: frankfurt
    databaseName: casino_db
    user: casino

services:
  - type: web
    name: casino-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casino-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 168h
      # Render's proxy reaches the service from its private network.
      - key: TRUSTED_PROXIES
        value: 10.0.0.0/8
      # https://casino-api.onrender.com (OAuth callbacks go to <API_URL>/api/auth/<provider>/callback)
      - key: API_URL
        sync: false
      # https://casino-web.onrender.com (CORS and WebSocket origin check)
      - key: FRONTEND_URL
        sync: false
      # A login provider is enabled when its client ID is set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false

  - type: web
    name: casino-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # https://casino-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      # wss://casino-api.onrender.com
      - key: VITE_WS_URL
        sync: false
    # Client-side routes (/lobby, /room/12345, ...) all load index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
